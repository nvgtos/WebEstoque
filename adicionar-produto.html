<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>WebEstoque</title>
</head>
<body class="add-product-body">
    <!-- SIDEBAR -->
    <nav id="sidebar">
        <div class="sidebar-top">
            <button id="sidebar-btn" type="button">
                <img id="table_rows_white" src="images/table_rows_white.svg" alt="">
            </button>
            <a href="index.html" class="sidebar-title" ><strong>WebEstoque</strong></a>  
        </div>

        <ul class="sidebar-items">
            <li class="side-item active">
                <a href="adicionar-produto.html" draggable="false">
                    <img class="side-item-img" src="images/add_product_white.svg" alt="" srcset="">
                    <span class="item-name">Adicionar Produto</span>
                </a>
            </li>

            <li class="side-item">
                <a href="produtos.html" draggable="false">
                    <img class="side-item-img" src="images/view_in_box_white.svg" alt="" srcset="">
                    <span class="item-name">Produtos</span>
                </a>
            </li>

            <li class="side-item">
                <a href="historico.html" draggable="false">
                    <img class="side-item-img" src="images/hisotry_white.svg" alt="" srcset="">
                    <span class="item-name">Histórico</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- OVERLAY -->
    <div id="sidebar-overlay"></div>

    <!-- CONTEUDO PRINCIPAL -->
    <main id="addProductMain">
        <div class="form-container">
            <form class="product-form">
                <div class="form-header">
                    <h1>Adicionar Produto</h1> 
                </div>

                <div class="form-group">
                    <label class="label" for="product" >Nome do Produto</label>
                    <input class="form-input" type="text" name="product" id="product" placeholder="Ex.: Açaí...">
                </div>

                <div class="form-group">
                    <label class="label" for="price" >Preço</label>
                    <input class="form-input" type="number" name="price" id="price">
                </div>

                <div class="form-group">
                    <label class="label" for="amount" >Quantidade</label>
                    <input class="form-input" type="number" name="amount" id="amount">
                </div>

                <div class="btn-container">
                    <button id="formBtn" type="button">Adicionar</button>
                </div>
            </form>
        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
    <!-- <script src="addProd.js"></script> -->

    
</body>
</html>
